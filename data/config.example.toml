# DexHid configuration example. Copy to ~/.config/dexhid/config.toml (or /etc/dexhid/config.toml) and keep only
# the keys you change. Merge order: built-in defaults, /usr/share/dexhid/devices/<matching preset>.toml,
# /etc/dexhid/config.toml, ~/.config/dexhid/config.toml, then `dexhid daemon --config <file>`.

# What happens when an external display is plugged in: "ask" (prompt on the tablet), "on", "off".
autostart = "ask"

# The internal touchscreen (evdev name) and output (wl_output name, or "auto" = first DSI / eDP / LVDS output).
touchscreen = "NVTCapacitiveTouchScreen"
internal_output = "auto"
# Panel size in mm in its native orientation (sets the touchpad resolution and key sizes).
size_mm = [274.0, 193.0]

# DRM connectors that count as an external display (wildcards * and ?).
external_connectors = ["DP-*", "HDMI-*", "USB-C-*"]
plug_debounce_ms = 1500
require_compositor_output = true

# Keyboard layout: "full" (PC), "tablet" (letters + symbols page), "split", "none" (touchpad only),
# or the name of a layout file in ~/.local/share/dexhid/layouts/ or /usr/share/dexhid/layouts/.
keyboard = "full"
# Optional rows / parts: "function" (F-key row), "numpad" (numeric keypad region of the full layout).
keyboard_options = ["function"]
# xkb layout group used for the key legends.
xkb_layout_index = 0

# Emergency release: hold these keys this long (read passively, never grabbed).
release_chord = ["KEY_VOLUMEUP", "KEY_VOLUMEDOWN"]
release_hold_ms = 2000
# Five fingers held still for 0.8 s anywhere also release.
five_finger_release = true

# Touchpad: click zones at the bottom of the pad (left / right button), pointer speed factor, palm threshold.
click_zones = true
click_zone_mm = 14.0
speed = 1.0
palm_major = 0

# Keys: hold delay before a held key presses (the desktop then repeats it), gap between keys.
hold_ms = 150
key_gap_mm = 1.2
strip_mm = 11.0

# Show a small "Use as pad" pill while the monitor is used as a plain display.
display_pill = true

# Touchpad only (no on-screen keyboard) while a physical keyboard (BT / USB / cover) is attached.
pad_only_with_physical_keyboard = false

# ---- M2: everything below is also in the settings sheet (Settings in the top bar). The sheet and `dexhid set`
# write their changes to ~/.config/dexhid/settings.toml, which overrides this file.
# "touchpad" (the desktop's touchpad driver) or "mouse" (DexHid's own relative-mouse recognizer).
mode = "touchpad"
# Applied to the virtual touchpad through the desktop (KWin InputDevice); other desktops: their own settings.
natural_scroll = false
tap_to_click = true
pointer_accel = 0.0
# Right click: "zones+tap" (click zones + two-finger tap), "tap", "zones".
right_click = "zones+tap"
# Dim the tablet panel while it is a touchpad (restored on release and by `dexhid --restore`).
dim = true
dim_percent = 20
backlight = "auto"
# Keyboard: sticky modifiers, long press for alternates (layout `long = ...`), key click sound.
sticky_modifiers = false
long_press_ms = 450
sound_feedback = false
haptic_feedback = false
track_layout = true
# Palm rejection: palm_major above (0 = off) also on the keys; rest zones at the panel edges (mm) and as
# [x, y, w, h] fractions of the area below the bar; pad touches ignored right after a key press; pen near = pause.
palm_keyboard = true
rest_zone_mm = 0.0
rest_zones = []
dwt_ms = 300
pen_pause = true
# Look: "desktop" (KDE: colour scheme, panel opacity / blur, corner radius from the desktop; elsewhere like "auto"),
# "dark", "light", "amoled", "auto" (follow the light / dark preference); accent colour; key opacity %; status
# text in the bar.
theme = "desktop"
accent = "#4a8be0"
key_alpha = 100
status_info = true

# M2.1 input behaviour. Keys: a pending key's 150 ms hold restarts after key_slop_mm of movement, sliding off a key
# needs key_slop_mm beyond its edge; a cancelled lone modifier is released behind a neutral key ("UNKNOWN", "F24"
# or "off") so its tap action (Super = launcher) does not run.
key_slop_mm = 3.0
modifier_mask = "UNKNOWN"
# 3/4 fingers moving together anywhere on the panel = a touchpad gesture of the desktop (swipe_min_mm of travel)
swipe_gestures = true
swipe_min_mm = 8.0
# both click zones within 50 ms = middle click; two-finger scroll inertia (GTK / Firefox add their own: off)
zone_chord_middle = false
scroll_inertia = false
inertia_friction = 4.0
# "free" (movable areas) or "laptop" (laptop grid, keyboard centred, touchpad below at laptop_pad_width %)
arrangement = "free"
laptop_pad_width = 100
# KDE: Plasma panels move to the external monitor while in pad mode and come back on release / at the next start
panels_follow = true

# Quick actions: which buttons show, in order ("id" or "id:2" for a double-size button). Built-in ids: copy paste
# cut undo redo select_all find save alt_tab show_desktop overview close_window other_screen fullscreen screenshot
# vol_down vol_up mute play_pause next prev mon_bright_up mon_bright_down (ddcutil) emoji (plasma-emojier).
[quick_actions]
enabled = true
actions = ["copy", "paste", "undo", "redo", "alt_tab", "show_desktop", "screenshot", "vol_down", "vol_up", "play_pause"]
# custom actions: a key chord or a command (argv list, never a shell)
# [[quick_actions.custom]]
# id = "newtab"
# label = "New tab"
# keys = "LEFTCTRL+T"
# [[quick_actions.custom]]
# id = "term"
# label = "Terminal"
# command = ["konsole"]

# Planned feature modules (stored now, acted on from M3): gestures, clipboard, textedit, remote, pen, suggest,
# profiles, mirror, wireless. Example:
# [features.gestures]
# enabled = true
# options = { three_swipe = "desktop", four_swipe = "overview", three_tap = "middle-click" }
