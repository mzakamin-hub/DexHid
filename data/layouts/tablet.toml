# SPDX-License-Identifier: GPL-3.0-or-later
# DexHid layout: simplified tablet keyboard (letters page + a numbers / symbols page, like an on-screen keyboard).
# The symbols page sends the punctuation keys of the desktop's layout (legends follow xkb); keys that need a
# modifier for one symbol use combo keys (M2: "LEFTSHIFT+2" = Shift+2; the legend shows what the desktop layout
# types). Long press on the top letter row gives the digits (M2 long-press alternates).
name = "tablet"
title = "Tablet keyboard"
description = "Letters and a numbers / symbols page"

[[part]]
region = "keyboard"

[[part.page]]
id = "main"

[[part.page.row]]
keys = [
  { key = "Q", long = "1" }, { key = "W", long = "2" }, { key = "E", long = "3" }, { key = "R", long = "4" }, { key = "T", long = "5" },
  { key = "Y", long = "6" }, { key = "U", long = "7" }, { key = "I", long = "8" }, { key = "O", long = "9" }, { key = "P", long = "0" }, { key = "BACKSPACE", label = "⌫" },
]

[[part.page.row]]
keys = [
  { gap = 0.5 },
  { key = "A" }, { key = "S" }, { key = "D" }, { key = "F" }, { key = "G" },
  { key = "H" }, { key = "J" }, { key = "K" }, { key = "L" }, { key = "ENTER", w = 1.5, label = "⏎" },
]

[[part.page.row]]
keys = [
  { key = "LEFTSHIFT", w = 2, label = "⇧" },
  { key = "Z" }, { key = "X" }, { key = "C" }, { key = "V" }, { key = "B" }, { key = "N" }, { key = "M" },
  { key = "COMMA" }, { key = "DOT" },
]

[[part.page.row]]
keys = [
  { action = "page:sym", w = 1.5, label = "?123" }, { key = "LEFTCTRL", w = 1.5 },
  { key = "SPACE", w = 5 },
  { key = "LEFT" }, { key = "RIGHT" }, { action = "fn", label = "Fn" }, { key = "ESC" },
]

[[part.page]]
id = "sym"

[[part.page.row]]
keys = [
  { key = "1" }, { key = "2" }, { key = "3" }, { key = "4" }, { key = "5" },
  { key = "6" }, { key = "7" }, { key = "8" }, { key = "9" }, { key = "0" }, { key = "BACKSPACE", label = "⌫" },
]

[[part.page.row]]
keys = [
  { key = "MINUS" }, { key = "EQUAL" }, { key = "LEFTBRACE" }, { key = "RIGHTBRACE" }, { key = "SEMICOLON" },
  { key = "APOSTROPHE" }, { key = "GRAVE" }, { key = "BACKSLASH" }, { key = "SLASH" },
  { key = "ENTER", w = 2, label = "⏎" },
]

[[part.page.row]]
keys = [
  { key = "LEFTSHIFT", w = 2, label = "⇧" }, { key = "TAB", w = 1.5 },
  { key = "HOME" }, { key = "END" }, { key = "PAGEUP" }, { key = "PAGEDOWN" },
  { key = "DELETE" }, { key = "INSERT" }, { key = "UP", w = 1.5 },
]

[[part.page.row]]
height = 0.9
keys = [
  { key = "LEFTSHIFT+1" }, { key = "LEFTSHIFT+2" }, { key = "LEFTSHIFT+3" }, { key = "LEFTSHIFT+4" }, { key = "LEFTSHIFT+5" },
  { key = "LEFTSHIFT+6" }, { key = "LEFTSHIFT+7" }, { key = "LEFTSHIFT+8" }, { key = "LEFTSHIFT+9" }, { key = "LEFTSHIFT+0" },
  { key = "LEFTSHIFT+MINUS" },
]

[[part.page.row]]
keys = [
  { action = "page:main", w = 1.5, label = "abc" }, { key = "LEFTCTRL", w = 1.5 },
  { key = "SPACE", w = 5 },
  { key = "LEFT" }, { key = "DOWN" }, { key = "RIGHT" },
]
