# SPDX-License-Identifier: GPL-3.0-or-later  (PROVISIONAL: the owner has not decided the licence yet;
# change every header before the repository goes public)
[workspace]
resolver = "2"
members = ["crates/dexhid-core", "crates/dexhid"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
publish = false

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

# M4: `blocking` with idle pool threads that exit (upstream 1.7 keeps them and wakes each every 500 ms; zbus uses the
# pool for its socket connect / close). Copy of blocking 1.7.0 (Apache-2.0 OR MIT), one change, see
# third_party/blocking/DEXHID-PATCH.md
[patch.crates-io]
blocking = { path = "third_party/blocking" }
